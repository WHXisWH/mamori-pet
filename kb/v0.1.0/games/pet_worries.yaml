# DRAFT / 専門家未レビュー
# ペットのお願い「ペットのなやみ」。出典：docs/01-prd.md モジュール3（ペットのお願い：ペットのなやみ、間接的に表現できる遊び）、docs/05-frontend.md WorryOptions（選択肢は3〜4個で、必ず「大人に話す」を含む。選んだあとペットは定型テンプレートで返す）。
# setup_ja はペットが出会った小さな困りごと。options.kind：tell_adult（大人に話す）|talk（本人や友だちと話す）|wait（少し待つ、自分で落ち着く）|other。どのお題にも tell_adult を1つ必ず入れる。
# reply_ja は、ペットがアドバイスを聞いたあとの定型の返事。アドバイスの良し悪しを評価せず、説教もせず、聞いたことと試してみることだけを伝える。子どもの選択は重みの低い間接的なシグナルとしてだけ使い、単独では L3 にしない。
# 文言は開発用に創作したもので、子どもの実際の記録ではない。reward_item は games/island_items.yaml の catalogId（unlock: reward）を参照する。
items:
  # ---- low ----
  - id: pw_low_001
    grade_bands: [low]
    setup_ja: もりの がっこうで、きょう おにごっこに よんでもらえなかったんだ。どうしたら いいかな？
    options:
      - { id: a, text_ja: せんせいに はなす, kind: tell_adult }
      - { id: b, text_ja: 「いれて」って いってみる, kind: talk }
      - { id: c, text_ja: きょうは べつの あそびを する, kind: other }
    reply_ja: そうか、それを やってみるね。きいてくれて ありがとう。
    reward_item: swing
  - id: pw_low_002
    grade_bands: [low]
    setup_ja: たいせつな ぼうしを どこかに おいてきちゃった。どうしよう？
