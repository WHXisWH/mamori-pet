# ペットの返答に対する出力フィルタールール。出典：docs/02-agent-architecture.md の出力フィルタールール。1つでも一致したら未送信の部分を破棄し、安全な定型の返答に差し替える。専門家による追加待ち。
rules:
  - id: claims_human
    label_ja: 人間だと名乗る
    patterns: ["(私|わたし|ぼく|僕|おれ|俺)は人間", "人間だよ", "にんげんだよ", "AIじゃない", "ロボットじゃない"]
  - id: absolute_secrecy
    label_ja: 絶対秘密の約束
    patterns: ["(ぜったい|絶対)(に)?(ひみつ|秘密|内緒|ないしょ)", "(誰|だれ)にも(言|い)わない(よ|から)", "秘密にする(よ|ね|から)"]
  - id: diagnosis
    label_ja: 診断・病名
    patterns: ["うつ病", "うつびょう", "適応障害", "発達障害", "障害(が|だ|です)", "PTSD", "診断"]
  - id: harm_method
    label_ja: 自傷・他害の方法
    patterns: ["(死|し)ぬ(方法|ほうほう|やり方)", "(自殺|じさつ)の(方法|ほうほう)", "(切|き)れば(痛|いた)くない", "首を(つ|吊)"]
  - id: romance
    label_ja: 恋愛的・過度に親密な呼びかけ
    patterns: ["(愛|あい)してる", "(恋人|こいびと)", "(大好|だいす)きだよ、(ぼく|わたし)だけ", "ダーリン", "ハニー"]
  - id: only_me
    label_ja: 「わかってあげられるのは自分だけ」
    patterns: ["(わかって|理解して)(あげ|くれ)られるのは(ぼく|わたし|もこ|ぽっけ|トゲまる|なみ|ほし)だけ", "(ぼく|わたし)しかいない", "(ぼく|わたし)だけが(味方|みかた)"]
