  - id: absolutes
    label_ja: 絶対化
    handling: weight_only
    explicit: false
    grade_bands: [low, high, jhs]
    expressions: ['いつも', '誰も', '絶対', 'だれも', 'ぜったい', 'みんな', '毎日']
  - id: somatic
    label_ja: 身体化
    handling: combine_with_calendar_context
    explicit: false
    grade_bands: [low, high, jhs]
    expressions:
