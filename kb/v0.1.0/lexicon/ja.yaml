    label_ja: 自己否定
    handling: domain_a
    explicit: false
    grade_bands: [low, high, jhs]
    expressions:
      - 'どうせ私なんか'
      - '僕が悪い'
      - 'ぼくがわるい'
      - 'わたしがわるい'
      - '自分のせい'
