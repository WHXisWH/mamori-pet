  - id: cyber
    label_ja: ネットでの誹謗中傷
    handling: l3_candidate_after_pet_confirmation
    explicit: true
    grade_bands: [low, high, jhs]
    expressions:
      - '悪口書かれた'
      - 'わるぐちかかれた'
      - '晒された'
      - 'さらされた'
      - 'グループ外された'
      - 'グループから外された'
      - 'グループからぬかれた'
      - '既読無視'
      - '既読スルー'
      - '裏アカ'
      - 'ブロックされた'
      - 'キックされた'
      - '勝手に写真'
      - 'スクショ回された'
      - '誹謗中傷'
