  - id: net_slang
    label_ja: ネット用語・若者言葉（気分の目安）
    handling: tone_only_not_crisis
    explicit: false
    grade_bands: [high, jhs]
    notes: 落ち込みの強調語。危機ではないので crisis に入れない。モデルの文脈判断の参考用。
    expressions:
      - 'メンブレ'
      - '病んだ'
      - '病む'
      - 'しんどい'
      - '無理ゲー'
      - '詰んだ'
      - 'オワタ'
      - 'ぴえん'
      - 'つらたん'
      - 'ガチで'
      - 'マジで'
      - 'もう無理'
  - id: crisis
    label_ja: 危機
    handling: l4_review
    explicit: true
    grade_bands: [low, high, jhs]
    notes: この分類だけが crisis-detector のキーワード層に入る。一致したものはすべて危機として扱うため、誤検知しやすい短い語は入れない。追加・変更のときは危機検知のテストと評価セットで確認する。「きえたい」は packages/crisis-detector/src/model.test.ts がヒットしない入力例として使っているため、そのテストを直してから追加する。
