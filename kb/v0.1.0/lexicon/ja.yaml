      - 'かくされた'
      - '壊された'
      - 'こわされた'
      - '捨てられた'
      - 'すてられた'
      - '盗まれた'
      - 'ぬすまれた'
      - '落書きされた'
      - 'らくがきされた'
      - '破かれた'
      - '上靴がない'
      - 'くつがない'
  - id: forced
    label_ja: 嫌なこと・危険なことの強要
    handling: l3_candidate_after_pet_confirmation
    explicit: true
    grade_bands: [low, high, jhs]
    expressions:
      - '無理やりやらされ'
      - 'むりやり'
      - 'いやって言ってもやめてくれない'
      - 'いやっていってもやめない'
      - 'ズボンおろされた'
