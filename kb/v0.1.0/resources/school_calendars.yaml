#   2. 更新したら source_ids に出典を登録し（先に sources/registry.yaml にエントリを作る）、verified_at と verified_by を記入して、verified を true にする。
#   3. 同じ都道府県でも市町村によって日程が違う場合（北海道の夏休みは地域によって異なる）は、必要に応じて city ごとに分ける。city が null のものは都道府県全体の通例を表す。
#   4. 2学期制の自治体は terms を2つにする。school_level は小学校と中学校で日程が違う場合の区別に使う。
#   5. 日付の形式は YYYY-MM-DD。start は end より後にできない。kb:check が検証する。
