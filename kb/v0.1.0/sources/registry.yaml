    notes: 種別：公的ガイドライン。要点：「心身の苦痛を感じているもの」の要件を限定して解釈しないよう求めている（第1の5）。 ／ 具体的な態様として8種を例示し、問題行動等調査の区分と対応している（PDF 9枚目）。 ／ いじめは大人の目に付きにくい時間・場所や、遊び・ふざけあいを装って行われると明記（PDF 11枚目）。 ／ ささいな兆候でも疑いを持って早く関わり、隠したり軽視したりしないことを求める（PDF 11枚目）。 ／ 早期発見の手段として定期的なアンケート、教育相談、電話相談窓口の周知を挙げる（PDF 11枚目）。。根拠にする箇所：A 領域の態様シグナルの定義と、弱いシグナルでも拾う設計方針。skills の teasing（ふざけあいを装う行為の扱い）、 exclusion、daily-listening、tell-adult。。注意：学校・設置者・教職員向けの方針であり、家庭用 AI の行動を直接定めるものではない。最終改定は平成29年で、 SNS や生成 AI の状況は反映していない。「疑いを持つ」姿勢は学校の認知の話で、子ども本人に「それはいじめだ」と断定することの根拠にはならない。。確認：PDF（58枚）を取得し、文書プロパティと本文で題名・決定日・最終改定日を確認。具体的な態様の列挙（PDF 9枚目、印字 p.5）、 「いじめの早期発見」の節（PDF 11枚目）を本文で確認。令和8年10月時点でこれより新しい改定がないかは、 令和7年10月29日付け文科省通知がこの版を参照していることまでしか確認していない。
