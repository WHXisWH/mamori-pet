    notes: 種別：縦断研究。要点：最も多いのは暴力を伴わないいじめで、典型は「仲間はずれ・無視・陰口」とする（p.4）。 ／ 被害経験率は中学男子平均32.2%、女子39.6%、小学男子45.8%、女子51.5%で急増減はない（p.4）。 ／ 中1の6月から11月で、被害経験者の約3分の1が入れ替わる（p.6〜7）。 ／ 6回連続で週1回以上の被害は0.3%、6回とも被害なしは31.5%にとどまる（p.7）。 ／ 6回とも加害経験なしは34.2%で、多くの子が加害と被害の両方に巻き込まれる（p.7）。。根拠にする箇所：A 領域の「仲間外れ・無視」シグナルを日常的に起こり得るものとして扱う根拠。skills の exclusion・self-blame （特定の子の性質の問題ではない）、teasing。シグナルを時系列で見る設計（一時点で固定しない）。。注意：特定の一地域の小中学校を対象にした匿名自記式の追跡で、全国代表ではない。調査は2015年までで SNS の影響は十分に反映されない。 「入れ替わる」という知見は、長く続く被害を軽く見てよいという意味ではない（半年後も高頻度が続く子が約36%いる）。 2016-2018 年版は今回取得できなかった。。確認：機関リポジトリから PDF（36枚）を取得。表紙で題名・発行年月・発行元を確認。p.4〜7 の本文（仲間はずれ・無視・陰口の 被害経験率の推移、中1から中3までの6回調査の入れ替わり）を読んで数値を確認。p.8 以降の暴力を伴ういじめの節と巻末の表は精査していない。
