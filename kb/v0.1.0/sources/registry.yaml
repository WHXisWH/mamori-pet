    notes: 種別：公的ガイドライン。要点：重大事態は「疑い」が生じた段階を指し、その段階から調査に向けた対応を始めるとする。 ／ 不登校重大事態は年間30日の欠席が目安。連続欠席なら30日前から設置者に報告・相談する（PDF 15枚目）。 ／ 児童生徒や保護者から申立てがあれば、重大事態が発生したものとして報告・調査に当たる（PDF 15枚目）。 ／ 旧「不登校重大事態に係る調査の指針」は廃止され、本ガイドラインに統合された。。根拠にする箇所：リスク判定ルールの上位段階（欠席が続く＋いじめの訴え、重い被害の示唆）。skills の tell-adult、school-morning。 「本人や保護者の訴えは軽く扱わない」という設計原則。。注意：学校・設置者の調査手続きを定める文書で、該当するかの判断主体は学校・設置者。AI が「重大事態」と判定・告知する根拠にはならない。 30日は目安であり、機械的な閾値として使うと見逃しと過剰反応の両方を生む。。確認：PDF（67枚）を取得し、文書プロパティと本文で題名・改訂版であることを確認。重大事態の定義、不登校重大事態の目安、 申立て時の扱いを PDF 15〜16枚目の本文で確認。チェックリスト等の別添は取得していない。
