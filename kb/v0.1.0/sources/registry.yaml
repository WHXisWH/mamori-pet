    notes: 種別：法令。要点：第2条は、一定の人的関係にある児童等の行為で、対象の児童等が心身の苦痛を感じているものをいじめと定義する。 ／ 定義にはインターネットを通じて行われる行為が明記されている（第2条第1項）。 ／ 第23条第1項は、相談を受けた者と保護者に、学校への通報その他の適切な措置をとることを求める。 ／ 第28条第1項は、生命・心身・財産の重大な被害の疑い（1号）と相当期間の欠席の疑い（2号）を重大事態とする。。根拠にする箇所：A 領域の全態様シグナル（本人が苦痛を感じているかを基準にする）。skills の tell-adult（大人へつなぐ法的な筋道）、 exclusion・teasing・online-distance。リスク判定ルールのうち重大事態に相当する段階（重い被害、欠席の継続）。。注意：定義は被害側の主観を基準にした広い定義で、行為の重さの判定基準ではない。第23条の通報の主語は教職員・相談に応じる者・保護者であり、 民間の AI サービスに通報義務を課す規定ではない。法の定義をそのまま子どもへの語りかけに使うと断定的になりやすい。。確認：法令ページ URL は HTTP 200 だが JavaScript 描画のため本文は直接読めなかった。同じ法令 ID の e-Gov 法令 API （https://laws.e-gov.go.jp/api/1/lawdata/425AC1000000071）で全文を取得し、題名・法律番号・第2条・第23条・第28条の条文を確認した。 現行条文の最終改正日は確認していない。
