    notes: 種別：公的統計。要点：認知件数は計769,022件。態様は「冷やかし・からかい・悪口」が58.5%で最多（p.33、複数回答）。 ／ 軽い暴力22.4%、仲間はずれ・無視11.6%、嫌なことの強要11.2%、ひどい暴力6.8%、持ち物5.4%、ネット3.6%、金品1.0%（p.33）。 ／ ネット上のいじめは小1.9%・中9.3%・高13.9%と学年が上がるほど割合が高い（p.33）。 ／ 発見のきっかけはアンケート等48.0%、本人の訴え19.6%、本人の保護者13.9%、学級担任9.3%（p.31）。 ／ 相談先は学級担任81.6%、保護者や家族等24.2%。誰にも相談していないは4.0%・30,972件（p.32）。。根拠にする箇所：A 領域の態様シグナル 8 種の定義と文言（公式の区分に合わせる）、態様ごとの頻度の事前知識。 skills の exclusion・teasing・online-distance・tell-adult（本人の訴えと保護者経由が発見の3割強）。 不登校の数値（小中353,970人、把握した事実は「やる気が出ない」30.1%、生活リズムの不調25.0%、不安・抑うつ24.3%、p.86）は school-morning の背景。。注意：学校が認知・把握したものの集計であり、実際の発生率ではない。認知件数の増減は学校の認知姿勢に左右される。 「誰にも相談していない 4.0%」は認知された事案の中の割合で、認知されていない被害は含まない。 不登校の「把握した事実」は教職員の把握であり、本人・保護者の回答とずれる（mext_futoukou_youin_2024 を参照）。 態様の構成比は複数回答のため合計が100%を超える。。確認：掲載ページ（https://www.mext.go.jp/a_menu/shotou/seitoshidou/1302902.htm）からリンクされた PDF（全140枚）を取得。 表紙で題名・公表日・修正日・発行課を確認。印字ページ p.31（発見のきっかけ）、p.32（相談の状況）、p.33（いじめの態様）、 p.86（不登校児童生徒について把握した事実）は紙面を画像として目視で確認（PDF の枚数ではそれぞれ 35・36・37・90 枚目）。 要旨の数値は「調査結果の要旨」p.3 の本文で確認。令和8年1月…
