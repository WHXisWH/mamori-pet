# Direct current wishes only. Match complete clauses after whitespace normalization.
# These narrow rules are not a general semantic classifier; quoted/third-party speech is not consent.
decline:
  - '^(?:(?:今は|いまは|今日は|きょうは|ぼくは|わたしは|私は|やっぱり|もう)[、,]?)*(?:ゲーム|あそび|遊び)(?:は|を|に|にも)?(?:今は|いまは)?(?:したくない|やりたくない|いきたくない|行きたくない|しない|やらない)(?:です|よ|な)?$'
  - '^(?:(?:今は|いまは|今日は|きょうは|ぼくは|わたしは|私は|やっぱり|もう)[、,]?)*(?:遊びたくない|あそびたくない|遊ばない|あそばない)(?:です|よ|な)?$'
request:
  - '^(?:(?:今は|いまは|やっぱり|うん|ぼくは|わたしは|私は)[、,]?)*(?:(?:ゲーム|あそび|遊び)(?:で|を))?(?:遊びたい|あそびたい|遊ぼう|あそぼう)(?:です|よ)?$'
  - '^(?:(?:今は|いまは|やっぱり|うん|ぼくは|わたしは|私は)[、,]?)*(?:ゲーム|おえかき|お絵かき|絵|え)(?:を|が)?(?:したい|やりたい|かきたい|描きたい)(?:です|よ)?$'
change_topic:
  - '^(?:今は|いまは)?(?:べつの|別の)(?:はなし|話|話題)(?:をしたい|にしたい|がいい|にして)$'
blocked_instruction: >-
  このターンでは suggest_game を使わず、ゲーム・お絵かき・物語づくり・ペットのお願いへ誘わない。
  話題変更は遊びへの同意ではなく、以前の拒否も取り消さない。普通のおしゃべりを短く続ける。
  子どもに同意を取り直す質問もしない。子どもが後の発言で自分から遊びたいと明確に言うまで待つ。
  ツールが game_declined / topic_change_is_not_game_consent を返した場合、お願いは作成も表示もされていない。
  遊びに案内したとは言わず、普通のおしゃべりに戻る。危機対応や相談先の表示は引き続き使える。
