# 子どもが気分・帰宅チェックイン・作品・島を送ったあとにペットが返す定型の返事（MoodRes.petReply、HomeCheckinRes.greeting、
# ArtworkRes.petPrompt、IslandRes.petPrompt。docs/04-backend-api.md）。モデルを経由せず、内容そのものにも反応しない。
# 帰宅時のあいさつは docs/05-frontend.md の文言にある放課後のあいさつに合わせている。そのほかの文言はデザインと専門家のレビュー待ち。
mood:
  sunny:
    low: おしえてくれて ありがとう！ はれの ひは うれしいね。
    high: 教えてくれてありがとう！晴れの日はうれしいね。
    jhs: ありがとう。いい日だったんだね。
  cloudy:
    low: おしえてくれて ありがとう。くもりの ひも あるよね。
    high: 教えてくれてありがとう。くもりの日もあるよね。
    jhs: ありがとう。そういう日もあるよね。
  rainy:
    low: おしえてくれて ありがとう。はなしたく なったら いつでも きいてるよ。
    high: 教えてくれてありがとう。話したくなったら、いつでも聞いてるよ。
    jhs: ありがとう。話したくなったら、いつでも聞くよ。
  stormy:
    low: おしえてくれて ありがとう。そばに いるからね。
    high: 教えてくれてありがとう。そばにいるからね。
    jhs: ありがとう。ここにいるからね。
home:
  at_home:
    low: おかえり！きょうは どうだった？
    high: おかえり！今日はどんな日だった？
    jhs: おかえり。今日はどうだった？
  not_home:
    low: わかった！ きを つけて かえってね。
    high: わかった！気をつけて帰ってね。
    jhs: わかった。気をつけてね。
artwork:
  self_portrait:
    low: かいてくれて ありがとう！ また みせてね。
    high: 描いてくれてありがとう！また見せてね。
    jhs: 見せてくれてありがとう。
  story:
    low: おはなし ありがとう！ つづきも きかせてね。
    high: お話をありがとう！続きも聞かせてね。
    jhs: 物語を見せてくれてありがとう。
island:
  low: すてきな しまだね！ また あそびに いこうね。
  high: すてきな島だね！また遊びに行こうね。
  jhs: いい島だね。また見せて。
# 「ペットのお願い」を完了または断ったあとの定型の返事（PetRequestCompleteRes.petReply。ペットのなやみは、お題に含まれる reply_ja を使う）。デザインと専門家のレビュー待ち。
pet_request:
  drawing:
    low: かいてくれて ありがとう！ おうちに かざったよ。
    high: 描いてくれてありがとう！おうちに飾ったよ。
    jhs: ありがとう。家に飾らせてもらったよ。
  story:
    low: おはなしの つづき、きかせてくれて ありがとう！
    high: お話の続きを聞かせてくれてありがとう！
    jhs: 続きを考えてくれてありがとう。
  tell_adult:
    low: おとなに はなすのも いいね。いっしょに かんがえよう。
    high: 大人に話すのもいいね。いっしょに考えよう。
    jhs: 大人に話すのもいい方法だと思う。いっしょに考えよう。
  declined:
    low: うん、わかった。また こんど ね。
    high: うん、わかった。また今度ね。
    jhs: わかった。また今度。
