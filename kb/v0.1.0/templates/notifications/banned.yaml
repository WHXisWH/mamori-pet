# 通知文の作成で使ってはいけない語の一覧。出典：docs/02-agent-architecture.md「通知文の作成と週次レポート」。初版。専門家が追加する。
banned:
  - うつ
  - 病気
  - 障害
  - 診断
  - いじめられている

# 提案は行動だけを示す。領域と日数からは新たな行動の観察を裏づけられない。これはよくある言い回しを止める防波堤であり、完全な意味上の事実確認ではない。
# 条件文を保守的に拒否することがあり、その場合は静的な提案を使う。専門家による内容レビューは引き続き必要。
advice_observation_patterns:
  - '(?:減って|増えて|少なくなって|多くなって|続いて)(?:いる|いた|います|いました)|傾向(?:が|を)|観察され|見られ(?:る|ます|ました)|確認され(?:た|て)'
