# landing-web のイメージをビルドする。東京リージョンで実行する。リポジトリのルートで実行する:
#   gcloud builds submit . --region=asia-northeast1 --config=apps/landing-web/cloudbuild.yaml \
#     --service-account=projects/<PROJECT_ID>/serviceAccounts/sa-landing-build@<PROJECT_ID>.iam.gserviceaccount.com \
#     --gcs-source-staging-dir=gs://<PROJECT_ID>-landing-build/source
# ソースは東京のバケットに一時保存する。指定しないと gcloud は米国マルチリージョンの <PROJECT_ID>_cloudbuild バケットにアップロードする。
# 2つの NEXT_PUBLIC_*_APP_URL はビルド時に画面へ埋め込まれ、子ども側・保護者側の Hosting URL を指す。
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: landing
  _SERVICE: landing-web
  _CHILD_APP_URL: https://mamori-child.web.app
  _GUARDIAN_APP_URL: https://mamori-guardian.web.app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  env:
    - DOCKER_BUILDKIT=1

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/landing-web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_CHILD_APP_URL=${_CHILD_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_GUARDIAN_APP_URL=${_GUARDIAN_APP_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

timeout: 1200s
