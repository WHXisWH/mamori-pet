# child-web のイメージをビルドする。東京リージョンで実行し、Terraform が管理する Artifact Registry リポジトリ ijime にプッシュする。
# リポジトリのルートで実行する（_IMAGE_TAG は必須。手動で submit すると SHORT_SHA は空になる。_FIREBASE_API_KEY は terraform output firebase_web_config から取得する）:
#   gcloud builds submit . --region=asia-northeast1 --config=apps/child-web/cloudbuild.yaml \
#     --service-account=projects/<PROJECT_ID>/serviceAccounts/sa-cloudbuild@<PROJECT_ID>.iam.gserviceaccount.com \
#     --gcs-source-staging-dir=gs://<PROJECT_ID>-cloudbuild-source/source \
#     --substitutions=_IMAGE_TAG=$(git rev-parse --short HEAD),_FIREBASE_API_KEY=<API_KEY>
# 既定の URL は Cloud Run の決定的な URL と Hosting の推奨サイト。カスタムドメインを使う場合は --substitutions で上書きする。
# その後 terraform apply -var web_image_tag=<_IMAGE_TAG> で Cloud Run サービス child-web のイメージを切り替える。
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: ijime
  _SERVICE: child-web
  _IMAGE_TAG: ${SHORT_SHA}
  _API_BASE_URL: https://api-${PROJECT_NUMBER}.${_REGION}.run.app
  _VOICE_WS_URL: wss://voice-relay-${PROJECT_NUMBER}.${_REGION}.run.app/v1/voice
  _CHILD_APP_URL: https://mamori-child.web.app
  _GUARDIAN_APP_URL: https://mamori-guardian.web.app
  _FIREBASE_PROJECT_ID: ${PROJECT_ID}
  _FIREBASE_AUTH_DOMAIN: ${PROJECT_ID}.firebaseapp.com
  _FIREBASE_API_KEY: ''
  _FIREBASE_VAPID_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true
  env:
    - DOCKER_BUILDKIT=1

steps:
  - id: check-substitutions
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        test -n "${_IMAGE_TAG}" || { echo "_IMAGE_TAG が空です。手動で submit するときは --substitutions=_IMAGE_TAG=<git short sha> を付けてください"; exit 1; }
        test -n "${_FIREBASE_API_KEY}" || echo "警告：_FIREBASE_API_KEY が空のため、子ども側で Firebase ログインを完了できません"

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/child-web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg
      - NEXT_PUBLIC_VOICE_WS_URL=${_VOICE_WS_URL}
      - --build-arg
      - NEXT_PUBLIC_CHILD_APP_URL=${_CHILD_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_GUARDIAN_APP_URL=${_GUARDIAN_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_VAPID_KEY=${_FIREBASE_VAPID_KEY}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

timeout: 1800s
